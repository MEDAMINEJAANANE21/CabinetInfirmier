server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Redirections relatives, pour garder le port choisi côté machine
    absolute_redirect off;

    # La racine ouvre le tableau de bord
    location = / {
        return 302 /html/index.html;
    }

    # La tournée de l'infirmier
    location = /tournee {
        return 302 /html/infirmier.html;
    }

    # Le dossier patient
    location = /patient {
        return 302 /html/patienthtml.html;
    }

    # Les fichiers XML, XSD et XSLT restent consultables
    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    types {
        text/html  html;
        text/css   css;
        application/javascript js;
        application/xml xml xsd xsl;
        image/png  png;
        text/plain puml;
    }
}
